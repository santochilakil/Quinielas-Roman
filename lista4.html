<head>

<title>Lista 4 - Quinielas Cancún</title>

<style>
*{

padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,Helvetica,sans-serif;
min-height:100vh;
background:linear-gradient(180deg,#0b3f8f 0%,#2b6fd1 45%,#0b3f8f 100%);

align-items:center;

 h1{

font-size:50px;

letter-spacing:1px;
background:transparent;
/* -webkit-background-clip:text;*/

color:#FFD700;
  text-shadow:
0 1px 1px rgba(255,255,255,.8),
0 2px 4px rgba(0,0,0,.35);

input{
width:50%;
max-width:260px;
height:34px;

to bottom,

);

0 4px 10px rgba(0,0,0,.25),

box-shadow:
0 0 15px #8fe9ff,

}

}

.tabla{

}
.tabla th,
.tabla td{

text-align:center;
padding:0;
}

.participante{
width:95px;
min-width:95px;

background:linear-gradient(to bottom,#5f5f5f,#1f1f1f,#000000,#4a4a4a);

font-weight:bold;

}

.p{
width:26px;
height:24px;
background:linear-gradient(to bottom,#fff6a0,#ffd84c,#ffc800,#ffe98b);
color:#000;

font-weight:bold;
}
.ps{
width:26px;
height:24px;
background:linear-gradient(to bottom,#fff6a0,#ffd84c,#ffc800,#ffe98b);
color:#000;
font-size:10px;
font-weight:bold;
}

.partido{
width:26px;
height:90px;
background:linear-gradient(to bottom,#fff6a0,#ffd84c,#ffc800,#ffe98b);
color:#000;

font-size:7px;

}

.partido-ps{
width:26px;
height:90px;
background:linear-gradient(to bottom,#ffd19a,#ff9f1c,#ff7b00,#ffc07a);
color:#000;
writing-mode:vertical-rl;
transform:rotate(180deg);
font-size:7px;
font-weight:bold;
padding:4px 2px;
}

#listaParticipantes td{
height:14px;
font-size:9px;
font-weight:bold;
background:#fff;
color:#000;
padding:0;
line-height:1;
}

#listaParticipantes td:first-child{
background:#000;
color:#fff;
text-align:left;
width:95px;
min-width:95px;
font-size:10px;
padding-left:5px;
line-height:1;
overflow:hidden;
white-space:nowrap;
text-overflow:ellipsis;
}
thead{
position:sticky;
top:0;
z-index:100;
}
 /* Todo tu CSS anterior */

#listaParticipantes .fila-resultados td{
    width:26px;
    min-width:26px;
    height:24px;
    background:linear-gradient(to bottom,#fff6a0,#ffd84c,#ffc800,#ffe98b);
    color:#000;
    text-align:center;
    font-weight:bold;
    border:2px solid #2a2a2a;
    padding:0;
}

.resultado-nombre{
    width:60px;
    min-width:60px;
    background:linear-gradient(to bottom,#fff6a0,#ffd84c,#ffc800,#ffe98b)!important;
    color:#000!important;
    font-size:10px;
    font-weight:bold;
}

.fila-resultados td[contenteditable]{
    width:24px;
    min-width:24px;
    height:8px;
    background:linear-gradient(to bottom,#fff6a0,#ffd84c,#ffc800,#ffe98b);
    color:#000;
    text-align:center;
    vertical-align:middle;
    font-size:14px;
    font-weight:bold;
    text-transform:uppercase;
    padding:0;
    border:2px solid #2a2a2a;
}
 .aciertos{
    width:22px;
min-width:22px;
max-width:22px;
    height:90px;
    background:linear-gradient(to bottom,#c6ff00,#8cff00,#58d600);
    color:#fff;
    writing-mode:vertical-rl;
    transform:rotate(180deg);
    text-align:center;
    vertical-align:middle;
    font-size:10px;
    font-weight:bold;
    text-shadow:1px 1px 2px #000;
    border:2px solid #2a2a2a;
    padding:4px 2px;
}
.aciertos-total{
    width:22px;
min-width:22px;
max-width:22px;
    height:24px;
    background:linear-gradient(to bottom,#c6ff00,#8cff00,#58d600) !important;
    color:#fff;
    border:2px solid #2a2a2a;
    text-align:center;
    font-size:14px;
    font-weight:bold;
    padding:0;
}
</style>


</head>

<body>
<img src="Logo.png" class="logo">

<h1 id="tituloLista">LISTA PRELIMINAR</h1>

<input
id="buscador"
type="text"
placeholder="🔍 Buscar participante..."
>
<div class="tabla-contenedor">

<table class="tabla">

<thead>

<tr>
<th class="participante" rowspan="2" id="premioEncabezado">
    <div style="font-size:13px;color:#FFD700;font-weight:bold;">PREMIO</div>
    <div id="premioTotal" style="font-size:28px;color:#fff;margin-top:2px;">$0</div>
    <div style="margin-top:65px;">PARTICIPANTES</div>
</th>


<th class="p">P1</th>
<th class="p">P2</th>
<th class="p">P3</th>
<th class="p">P4</th>
<th class="p">P5</th>
<th class="p">P6</th>
<th class="p">P7</th>
<th class="p">P8</th>
<th class="p">P9</th>

<th class="ps">PS</th>
<th class="aciertos" rowspan="2">ACIERTOS</th>

</tr>



<tr id="filaPartidos"></tr>

</thead>

<tbody id="listaParticipantes">

<tr class="fila-resultados" id="filaResultados">

<td class="resultado-nombre">RESULTADOS</td>

<td contenteditable="true"></td>
<td contenteditable="true"></td>
<td contenteditable="true"></td>
<td contenteditable="true"></td>
<td contenteditable="true"></td>
<td contenteditable="true"></td>
<td contenteditable="true"></td>
<td contenteditable="true"></td>
<td contenteditable="true"></td>
<td contenteditable="true"></td>
<td class="aciertos-total"></td>
</tr>

</tbody>

</table>

</div>
 <script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
doc,
getDoc
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyB1gDhB37nA5F-zk6-M0hAvZJTGvW6SOBQ",
authDomain:"quinielas-cancun.firebaseapp.com",
projectId:"quinielas-cancun",
storageBucket:"quinielas-cancun.firebasestorage.app",
messagingSenderId:"419348494986",
appId:"1:419348494986:web:b73e42c52c3f41e19b8b73"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
  let jornada = [];
let suplente = [];

const jornadaDoc = await getDoc(doc(db,"config","jornada"));

if(jornadaDoc.exists()){

    const config = jornadaDoc.data();
    document.getElementById("tituloLista").innerHTML =
    "<span style='font-size:38px;color:#FFD700;font-weight:900;text-shadow:2px 2px 4px #000;'>JORNADA " +
    config.jornada +
    "</span><br><span style='font-size:22px;color:#FFD700;font-weight:bold;text-shadow:2px 2px 4px #000;'>" +
    config.fechaInicio +
    " al " +
    config.fechaFin +
    "</span>";

}
  const lista = document.getElementById("listaParticipantes");
  const snapshot = await getDocs(collection(db,"quinielas"));
let contador = 1;
console.log("Quinielas encontradas:", snapshot.size);
const participantes = [];

snapshot.forEach(doc => {
    const d = doc.data();

    if (d.estado === "Pagó") {
        participantes.push(d);
    }
});

participantes.sort((a,b)=>a.nombre.localeCompare(b.nombre,"es"));
participantes.forEach(d => {



  
 d.quinielas.forEach((q, i) => {

  const fila = document.createElement("tr");

 fila.innerHTML = `
<td>${contador++} ${d.nombre}</td>
<td>${q.jugadas[0]}</td>
<td>${q.jugadas[1]}</td>
<td>${q.jugadas[2]}</td>
<td>${q.jugadas[3]}</td>
<td>${q.jugadas[4]}</td>
<td>${q.jugadas[5]}</td>
<td>${q.jugadas[6]}</td>
<td>${q.jugadas[7]}</td>
<td>${q.jugadas[8]}</td>
<td>${q.jugadas[9]}</td>
<td class="aciertos-total">0</td>
`;

  lista.appendChild(fila);

});
});
  const COSTO_QUINIELA = 20;

const totalQuinielas = contador - 1;
const premio = Math.floor(totalQuinielas * COSTO_QUINIELA * 0.70);

document.getElementById("premioTotal").textContent =
"$" + premio.toLocaleString("es-MX");
const buscador = document.getElementById("buscador");
buscador.addEventListener("keydown", function(e){

    if(e.key !== "Enter") return;

    e.preventDefault();
const texto = buscador.value.trim().toLowerCase();
const filas = document.querySelectorAll("#listaParticipantes tr");
let encontrado = false;
 for (const fila of filas) {
const nombre = fila.cells[0].textContent.toLowerCase();

if(nombre.includes(texto)){
    fila.scrollIntoView({
    behavior: "smooth",
    block: "center"
});

// Resaltar toda la fila
fila.style.transition = "all .3s";

for(let i=0; i<fila.cells.length; i++){
    fila.cells[i].style.setProperty("background","#FFF176","important");
    fila.cells[i].style.color = "#000";
    fila.cells[i].style.fontWeight = "bold";
}

setTimeout(()=>{

    for(let i=0; i<fila.cells.length; i++){
        fila.cells[i].style.backgroundColor = "";
        fila.cells[i].style.color = "";
        fila.cells[i].style.fontWeight = "";
    }

},3000);
 encontrado = true;
 break;
}
 } 
if(!encontrado){
    alert("Participante no encontrado");
}
 
});
  const filaResultados = document.getElementById("filaResultados");
function ordenarParticipantes(){

    const filas = Array.from(lista.querySelectorAll("tr"))
        .filter(f => !f.classList.contains("fila-resultados"));

    filas.sort((a,b)=>{

        const aciertosA = parseInt(a.cells[11].textContent) || 0;
        const aciertosB = parseInt(b.cells[11].textContent) || 0;

        // Mayor número de aciertos primero
        if(aciertosA !== aciertosB){
            return aciertosB - aciertosA;
        }

        // Si empatan, ordenar por nombre
        const nombreA = a.cells[0].textContent.replace(/^\d+\s*/,"").trim();
        const nombreB = b.cells[0].textContent.replace(/^\d+\s*/,"").trim();

        return nombreA.localeCompare(nombreB,"es");
    });

    let numero = 1;

  const mayorAciertos = Math.max(
    ...filas.map(f => parseInt(f.cells[11].textContent) || 0)
);

filas.forEach(fila=>{

    const nombre = fila.cells[0].textContent.replace(/^\d+\s*/,"").trim();

    fila.cells[0].textContent = numero++ + " " + nombre;

    const aciertos = parseInt(fila.cells[11].textContent) || 0;

    if(aciertos === mayorAciertos){
        fila.cells[11].style.setProperty("background","#7CFC00","important");
        fila.cells[11].style.color = "#000";
    }else{
        fila.cells[11].style.setProperty("background","#FFF9C4","important");
        fila.cells[11].style.color = "#000";
    }

    lista.appendChild(fila);

});  

}
function actualizarTabla(){

    const filas = document.querySelectorAll("#listaParticipantes tr");

    filas.forEach((fila, indice)=>{

        if(indice===0) return;

        let aciertos = 0;

        for(let c=1;c<=10;c++){

            const resultado=filaResultados.cells[c].textContent.trim().toUpperCase();
            const celda=fila.cells[c];

            celda.style.backgroundColor="";

            if(
                resultado!=="" &&
                celda.textContent.trim().toUpperCase()===resultado
            ){
                celda.style.backgroundColor="#00ff66";
                aciertos++;
            }

        }

        fila.cells[11].textContent=aciertos;

    });

    ordenarParticipantes();

}

filaResultados.addEventListener("input",()=>{

    actualizarTabla();

});

const configDoc = await getDoc(doc(db,"config","jornada"));

if(configDoc.exists()){

    const config=configDoc.data();

    if(config.partidos){

        config.partidos.forEach((p,i)=>{

            if(p.resultado){

                filaResultados.cells[i+1].textContent=p.resultado;

            }

        });

        actualizarTabla();

    }

}
  console.log("Firebase conectado");

</script>
</body>

</html>
